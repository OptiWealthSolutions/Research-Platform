<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research Platform</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link href="horacle.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

    <!-- HEADER : charte Horacle UI (horacle.css, copie de Horacle Orchestrator/design/horacle-ui) -->
    <header class="ho-header">
        <div>
            <h1>Research Platform</h1>
            <p>Macro Survey · flux macro, recherche, thèses</p>
        </div>
        <div class="ho-header-right" id="ho-header-right"></div>
    </header>
    <nav class="ho-tabs">
        <a href="#" class="ho-tab tab tab-active" data-tab="feed">Feed</a>
        <a href="#" class="ho-tab tab" data-tab="quant">Quant / algo</a>
        <a href="#" class="ho-tab tab" data-tab="compare">Comparateur</a>
    </nav>

    <!-- MAIN (scroll plein écran, header & navbar statiques) -->
    <main class="page-body">

        <!-- SECTION TITRE (dynamique selon onglet) -->
        <div class="section-header">
            <span class="section-title">FLUX</span>
        </div>

        <!-- INDICATEUR SENTIMENT DE MARCHÉ (EmbeddingProp · Track A News) -->
        <section id="market-sentiment-strip" class="sentiment-strip"></section>

        <!-- BARRE DE FILTRES (pleine largeur, visible sur FEED uniquement) -->
        <div class="filter-bar" id="filter-bar">
            <div class="filter-row">
                <input type="text" id="filter-search" class="f-input" placeholder='Recherche (titre, résumé, auteur) — supporte AND / OR / NOT et "phrase exacte"' />
                <input type="text" id="filter-author" class="f-input" placeholder="Auteur" />
                <input type="text" id="filter-doi" class="f-input" placeholder="DOI" />
                <input type="text" id="filter-domain" class="f-input" placeholder="Domaine / Source" />
                <input type="date" id="filter-date-from" class="f-input" />
                <input type="date" id="filter-date-to" class="f-input" />
                <select id="filter-horizon" class="f-select"></select>
                <select id="filter-category" class="f-select"></select>
                <select id="filter-source" class="f-select"></select>
                <select id="filter-thematic" class="f-select"></select>
                <select id="filter-region" class="f-select"></select>
                <select id="filter-pair" class="f-select"></select>
                <select id="filter-sentiment" class="f-select"></select>
            </div>
            <div class="filter-actions">
                <button id="btn-saved" class="f-btn">SAVED</button>
                <button id="btn-view-toggle" class="f-btn">GRID</button>
                <label class="f-label">SORT</label>
                <select id="sort-select" class="f-select"></select>
                <button id="btn-export" class="f-btn">CSV</button>
                <button id="btn-refresh" class="f-btn primary">SYNC</button>
                <button id="btn-analyze" class="f-btn">EMBEDPROP</button>
                <button id="btn-auto" class="f-btn primary">AUTO 30M</button>
            </div>
        </div>

        <!-- VUE GRID (4 colonnes, plein écran) -->
        <div id="grid-view" class="table-grid"></div>

        <!-- VUE PREVIEW (liste à gauche + aperçu à droite) -->
        <div id="preview-view" class="preview-layout hidden">
            <div id="feed-list" class="card-list"></div>
            <div class="right-col">
                <div class="preview-header">
                    <span class="preview-title">APERÇU</span>
                    <button id="btn-close-preview" class="close-btn">Fermer</button>
                </div>
                <div id="feed-preview" class="preview-content"></div>
            </div>
        </div>

        <!-- SECTION COMPARATEUR DE SOURCES (onglet dédié) -->
        <section id="compare-section" class="compare-section">
            <div class="section-header">
                <span class="section-title">COMPARATEUR DE SOURCES</span>
            </div>
            <div class="filter-row compare-controls" style="margin-bottom:16px;">
                <label class="f-label">Période (jours)</label>
                <input type="number" id="compare-days" class="f-input" style="width:80px;" value="30" min="1" max="365" />
                <label class="f-label" style="margin-left:12px;">Zones</label>
                <input type="text" id="compare-zones" class="f-input" style="width:120px;" value="US,EU" placeholder="US,EU" />
                <button id="btn-compare-run" class="f-btn primary" style="margin-left:12px;">Exécuter</button>
            </div>
            <div id="compare-results" class="compare-results"></div>
        </section>

    </main>

    <script src="app.js"></script>

    <!-- MODAL LECTURE DIRECTE (iframe) -->
    <div id="reader-modal" class="reader-modal hidden">
        <div class="reader-modal-backdrop" id="reader-backdrop"></div>
        <div class="reader-modal-content">
            <div class="reader-header">
                <h3 id="reader-title">Lecture directe</h3>
                <button id="btn-reader-close" class="close-btn">× Fermer</button>
            </div>
            <div class="reader-body">
                <iframe id="reader-iframe" src="" style="width:100%;height:70vh;border:0;"></iframe>
                <div id="reader-fallback" class="reader-fallback hidden">
                    <p class="small">L'éditeur bloque l'intégration directe. <a id="reader-open" target="_blank" rel="noopener">Ouvrir l'article dans un nouvel onglet →</a></p>
                </div>
            </div>
        </div>
    </div>
    <script src="horacle.js" data-app="research"></script>
</body>
</html>
